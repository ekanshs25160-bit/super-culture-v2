name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Backend tests
        run: npm test --prefix backend

      - name: Frontend tests
        run: npm test --prefix frontend

      - name: Build frontend (standalone, no external API URL)
        run: env -u VITE_API_URL npm run build --prefix frontend

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK will be signed with the debug key."
          fi

      - name: Resolve version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ANDROID_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_NAME=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        working-directory: frontend/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/release/*.apk "super-culture-${ANDROID_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: super-culture-apk
          path: super-culture-*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: super-culture-*.apk
          generate_release_notes: true
